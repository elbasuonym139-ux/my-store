<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الملابس العصري</title>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f4f9; color: #333; }
        header { background: #111; color: #fff; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .card h3 { margin: 10px 0; font-size: 18px; }
        .card p { color: #e44d26; font-weight: bold; margin-bottom: 10px; }
        .btn { background: #111; color: #fff; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; width: 100%; transition: 0.3s; }
        .btn:hover { background: #e44d26; }
        .checkout-box { margin-top: 40px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .checkout-box h2 { margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .success-msg { color: green; font-weight: bold; margin-top: 10px; display: none; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>متجر الملابس العصري 👕</h1>
        <p>اختار لبسك، اطلب، والطلب هيوصلك فوراً!</p>
    </header>

    <div class="container">
        <h2>المنتجات المتاحة</h2>
        <br>
        <div class="products-grid" id="products-list">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" alt="تيشيرت أسود">
                <h3>تيشيرت أسود كاجوال</h3>
                <p>250 جنيه</p>
                <button class="btn" onclick="addToCart('تيشيرت أسود كاجوال', 250)">إضافة للسلة</button>
            </div>
        </div>

        <!-- قسم إتمام الطلب -->
        <div class="checkout-box">
            <h2>🛒 تفاصيل إتمام الطلب</h2>
            <div id="cart-summary" style="margin-bottom: 15px; font-weight: bold; color: #555;">السلة فارغة</div>
            
            <div class="form-group">
                <label>الاسم بالكامل:</label>
                <input type="text" id="c-name" placeholder="أدخل اسمك هنا">
            </div>
            <div class="form-group">
                <label>رقم التليفون:</label>
                <input type="text" id="c-phone" placeholder="رقم الموبايل للتواصل">
            </div>
            <div class="form-group">
                <label>العنوان بالتفصيل:</label>
                <input type="text" id="c-address" placeholder="المحافظة، المدينة، الشارع، رقم الحلة">
            </div>

            <button class="btn" style="background: #28a745; font-size: 16px;" onclick="submitOrder()">تأكيد وإرسال الطلب</button>
            <p id="success-msg" class="success-msg">تم إرسال طلبك بنجاح! سيتم التواصل معك قريباً.</p>
        </div>
    </div>

    <!-- Firebase SDKs (نسخة متوافقة مباشرة مع المتصفح) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        // إعدادات الـ Firebase الخاصة بيك من مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyCXSLqtba3kdvq9RjnIWLeM.d8xT_H723TSay",
            authDomain: "my-store-7a81c.firebaseapp.com",
            projectId: "my-store-7a81c",
            storageBucket: "my-store-7a81c.firebasestorage.app",
            messagingSenderId: "1003491501822",
            appId: "1:1003491501822:web:f3ddc2chb151bbd033a27af"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let selectedProduct = null;

        function addToCart(name, price) {
            selectedProduct = { name: name, price: price };
            document.getElementById('cart-summary').innerHTML = `المنتج المختار: ${name} - السعر: ${price} جنيه`;
            alert("تم إضافة المنتج للسلة بنجاح!");
        }

        function submitOrder() {
            let name = document.getElementById('c-name').value;
            let phone = document.getElementById('c-phone').value;
            let address = document.getElementById('c-address').value;

            if(!name || !phone || !address) {
                alert("من فضلك ادخل كل البيانات (الاسم، التليفون، العنوان)!");
                return;
            }

            if(!selectedProduct) {
                alert("من فضلك اختر منتج أولاً لإضافته للسلة!");
                return;
            }

            db.collection("orders").add({
                customerName: name,
                customerPhone: phone,
                customerAddress: address,
                productName: selectedProduct.name,
                productPrice: selectedProduct.price,
                orderDate: new Date().toLocaleString()
            })
            .then(() => {
                document.getElementById('success-msg').style.display = 'block';
                document.getElementById('c-name').value = '';
                document.getElementById('c-phone').value = '';
                document.getElementById('c-address').value = '';
                selectedProduct = null;
                document.getElementById('cart-summary').innerHTML = 'السلة فارغة';
            })
            .catch((error) => {
                alert("حدث خطأ أثناء إرسال الطلب: " + error.message);
            });
        }
    </script>
</body>
</html>
